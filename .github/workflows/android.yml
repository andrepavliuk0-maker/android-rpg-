name: Build Mage RPG Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Start ADB
        run: |
          adb start-server
          adb version

      - name: Download Godot 4.5.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.1-stable_linux.x86_64.zip
          mv Godot_v4.5.1-stable_linux.x86_64 godot
          chmod +x godot

      - name: Install Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.5.1.stable

          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz

          mkdir -p /tmp/godot_templates

          unzip -q Godot_v4.5.1-stable_export_templates.tpz \
            -d /tmp/godot_templates

          cp -r /tmp/godot_templates/templates/* \
            ~/.local/share/godot/export_templates/4.5.1.stable/

      - name: Configure Godot Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"
          adb version

      - name: Import project
        run: |
          ./godot --headless --path . --editor --quit

      - name: Build APK
        run: |
          mkdir -p build

          ./godot \
            --headless \
            --path . \
            --export-debug "Android" \
            build/MageRPG.apk

      - name: Check APK
        run: |
          ls -lh build/MageRPG.apk
          file build/MageRPG.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MageRPG-APK
          path: build/MageRPG.apk
